# Workflow: gera SVGs de estatísticas locais e commita para o repositório
# Rode manualmente ou automaticamente (cron). Garante que README referencie imagens locais.

name: Generate README Stats

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # diário às 06:00 UTC

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create assets folder
        run: |
          mkdir -p assets

      - name: Fetch GitHub Stats SVG
        env:
          USERNAME: maiconparra
        run: |
          curl -s -o assets/github-stats.svg "https://github-readme-stats.vercel.app/api?username=${USERNAME}&show_icons=true&theme=tokyonight&hide_border=true"
          curl -s -o assets/top-langs.svg "https://github-readme-stats.vercel.app/api/top-langs/?username=${USERNAME}&layout=compact&theme=tokyonight&hide_border=true"
          curl -s -o assets/profile-cards.svg "https://github-profile-summary-cards.vercel.app/api/cards/profile-details?username=${USERNAME}&theme=dark"

      - name: Commit and push stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/top-langs.svg assets/profile-cards.svg || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: update generated README stats [skip ci]" || true
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes to commit"
          fi
